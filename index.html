<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recettes — Préparations et astuces</title>
    <meta name="google-site-verification" content="tIGn24Ypejla-6mDoeXTBlyFszFj_gDYlglyNSSkoHM" />
    <meta name="description" content="Recettes faciles et rapides : idées de plats, ingrédients et instructions pas à pas pour cuisiner au quotidien.">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./asset/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-black">
    <!-- loader -->
    <div id="loader">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Chargement...</span>
        </div>
    </div>
    <div id="content">
    <!-- button of theme -->
    <button class="bi bi-sun-fill btn-theme-light btn-theme"></button>
    <button class="bi bi-moon-fill btn-theme-dark btn-theme"></button>
    <!-- header -->
    <header class="header">
        <a href="./index.html" class="title">FastaFood</a>
        <form class="search-form">
            <input type="text" id="" class="search-box" placeholder="Search a food...">
            <button type="submit" class="search-btn">Search</button>
        </form>
    </header>
    <!-- section -->
    <main>
        <section>
            <article>
                <div class="recipe-container container">
                    <div class="row">
                        <h2 class="recipe-title">search your favorite recipe !</h2>
                        <!-- add card of recipe -->
                    </div>
                </div>
            </article>
            <div class="box">
                <button type="button" class="bi bi-x recipe-close-btn"></button>
                <div class="recipe-details"><!-- add ingredient and instruction of recipe  --></div>
            </div>
        </section>
    </main>
</div>


    <!-- link script -->
    <script src="main.js"></script>
</body>


</html>
